name: 국민연금 대시보드 배포

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"

permissions: {}

concurrency:
  group: dashboard-pages
  cancel-in-progress: false

jobs:
  build:
    name: 정적 대시보드 빌드
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Python 3.12 준비
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: uv 준비
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          cache-dependency-glob: dashboard/requirements.txt

      - name: 빌드 패키지 설치
        run: uv pip install --system -r dashboard/requirements.txt

      - name: 커밋된 집계 데이터로 대시보드 빌드
        run: python dashboard/build.py

      - name: 배포 데이터 검증
        run: python -m unittest discover -s dashboard/tests -v

      - name: GitHub Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard/dist

  deploy:
    name: GitHub Pages 게시
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 정적 대시보드 배포
        id: deployment
        uses: actions/deploy-pages@v4
